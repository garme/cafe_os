<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 12; }
      .box2 { fill: #102030; stroke: #2ea043; stroke-width: 2; rx: 12; }
      .box3 { fill: #241a0f; stroke: #d29922; stroke-width: 2; rx: 12; }
      .txt { fill: #c9d1d9; font-family: Arial, sans-serif; font-size: 15px; }
      .small { fill: #8b949e; font-family: Arial, sans-serif; font-size: 12px; }
      .title { fill: #f0f6fc; font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; }
      .arrow { stroke: #8b949e; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #30363d; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b949e" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="390" rx="16"/>
